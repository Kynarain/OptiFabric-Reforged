name: Compatibility issue
description: Report an incompatibility with another mod
title: "Incompatible with MOD NAME HERE"
# Uncomment the next line after creating a "compatibility" label in this repository.
# labels: ["compatibility"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: |
        Please take the following steps seriously before reporting a compatibility issue.
        They ensure that the report can be resolved quickly and reduce overhead for maintainers.
        Conflicting mods can be isolated with the method described here:
        https://gist.github.com/TomeWyrm/a8cff19ce112edbc3c8a
      options:
        - label: I have read the text above
          required: true
        - label: I have read the [FAQ](https://github.com/Kynarain/OptiFabric-Reforged/blob/main/README.md) section before submitting a new issue
          required: true
        - label: I have read the [compatibility](https://github.com/Kynarain/OptiFabric-Reforged/blob/main/COMPATIBILITY.md) section before submitting a new issue
          required: true
        - label: I have searched the [issue tracker](https://github.com/Kynarain/OptiFabric-Reforged/issues?q=is%3Aissue) for identical issues before submitting a new issue
          required: true
        - label: I have isolated the conflicting mod (using the method described above), and my game logs and screenshots will reflect that
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe a clean installation: Fabric Loader, Fabric API, OptiFabric Reforged, the OptiFine build, and the conflicting mod - nothing else.
        What steps are required to launch the game, and how does the incompatibility present itself?

        OptiFabric Reforged applies OptiFine's own class patches before Mixin runs, so the most useful detail is the first real failure in the log:
        the mod id that was being transformed, and whether it says "Scanned 0 target(s)" or "No refMap loaded".
        The same four lines of a short crash report are usually worth more than a long comment.

        If applicable, add screenshots to help explain the issue.
    validations:
      required: true
  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft version
      multiple: true
      options:
        - '26.2'
        - '26.1.2'
        - '1.21.11'
        - '1.21.10'
        - '1.21.9'
        - '1.21.8'
        - '1.21.7'
        - '1.21.6'
        - '1.21.4'
        - '1.21.3'
        - '1.21.1'
        - '1.21'
        - '1.20.6'
    validations:
      required: true
  - type: input
    id: optifine-build
    attributes:
      label: OptiFine build
      description: |
        The exact file name of the OptiFine jar you used, e.g. preview_OptiFine_26.2_HD_U_K2_pre5.jar.
        OptiFabric Reforged only works with the build that matches your Minecraft version, so the build name matters as much as the mod version.
      placeholder: preview_OptiFine_26.2_HD_U_K2_pre5.jar
    validations:
      required: true
  - type: input
    id: mod-name
    attributes:
      label: Incompatible mod name
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Incompatible mod version
    validations:
      required: true
  - type: input
    id: logs
    attributes:
      label: Game Logs
      description: |
        Navigate to `.minecraft/logs/`, upload the file named `latest.log` to https://mclo.gs/ and paste the link here.
        The location of the logs might be different if you are using a custom launcher.

        If the game also wrote `crash-reports/crash-<date>-client.txt`, upload that one too: `latest.log` usually stops right before the mixin failure,
        while the crash report carries the full stack. For Mixin failures the crash report is the more useful of the two.
        mclo.gs masks your user name and absolute paths automatically; check the result before you submit.
    validations:
      required: true
