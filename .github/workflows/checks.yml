# What CI does, and what it deliberately does not do.
#
# It does NOT launch Minecraft. A green build here does not mean the game runs: that is what the captured
# logs under the verification toolchain are for (VerifyPatched for the patched classes, and one
# launch-<version>.out.log per Minecraft version). Claiming more than this in CI would be the mistake this
# file exists to avoid - a gate that reports success while the thing itself is untested.
#
# The windows runner matches the environment the release scripts are written for, and PowerShell is
# available there without extra setup.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  silent-catch-lint:
    name: silent-catch lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Silent-catch lint
        shell: pwsh
        run: ./tools/check-silent-catches.ps1

  docs-gate:
    name: documentation gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Links, version numbers, encoding
        shell: pwsh
        run: ./tools/check-docs.ps1
  support-table:
    name: support table
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Support table cross-check
        shell: pwsh
        run: ./release/version.ps1 -CheckSupport

# No build job on this line yet. It would need the Java version and the build switch this line uses, and
# neither has been exercised on a runner - a job that is red for the wrong reason is worse than no job.

  build:
    name: build (${{ matrix.mc }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.1.2']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        shell: pwsh
        run: ./gradlew build "-Pminecraft_version=${{ matrix.mc }}" --console=plain
