# What CI does, and what it deliberately does not do.
#
# It does NOT launch Minecraft. A green build here does not mean the game runs: that is what the captured
# logs under the verification toolchain are for (VerifyPatched for the patched classes, and one
# launch-<version>.out.log per Minecraft version). Claiming more than a build and a lint in CI would be the
# mistake this file exists to avoid - a gate that reports success while the thing itself is untested.
#
# It runs the checks that are cheap, deterministic and meaningful on every push and pull request:
#   1. the silent-catch lint (tools/check-silent-catches.ps1)
#
# The windows runner matches the environment the release scripts are written for, and PowerShell is
# available there without extra setup.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  silent-catch-lint:
    name: silent-catch lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Silent-catch lint
        shell: pwsh
        run: ./tools/check-silent-catches.ps1

  # Enabled once the toolchain is in the repository. Both of these are meaningful offline; neither claims
  # to have run the game.
