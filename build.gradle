plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// The mod id and display name this branch publishes. They are inputs of processResources below: without an
// inputs.property for them Gradle treats the expanded fabric.mod.json as up to date and keeps handing out the
// previous id, which is how a rename silently fails to take effect. The published 1.20.6 line keeps
// `optifabric`; this branch publishes the alternative product, so the id and the display name are the only
// metadata that differs between the two jars.
def modId = "optifabric_reforged"
def modName = "OptiFabric Reforged"

repositories {
    // Loom already adds the repositories needed for Minecraft, Fabric Loader and the mapping artifacts.
}

configurations {
    // OptiFine is remapped from the official (obfuscated) namespace to intermediary at runtime, so the
    // intermediary mappings have to be available inside the built jar. Upstream OptiFabric did the same.
    intermediaryMappings
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    intermediaryMappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"

    // All of these are provided at runtime by Fabric Loader / its launch libraries:
    // ASM and Mixin are launch libraries, and tiny-remapper + mapping-io are shaded inside the loader jar
    // (net.fabricmc.loader.impl.lib.tinyremapper / ...mappingio). Nothing is bundled into this mod.
    compileOnly "org.ow2.asm:asm:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-tree:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-commons:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-analysis:${project.asm_version}"
    // JNA is provided at runtime by Minecraft itself (it is what the Windows self-restart in
    // OptifineDownloader uses). compileOnly keeps it out of the jar, so nothing is bundled and the runtime
    // version is the game's own. 5.14.0 is the version Minecraft 1.20.6 declares in its version json; the 5.x
    // API used here (GetCommandLineW, CreateProcessW, STARTUPINFO, PROCESS_INFORMATION) is stable across 5.x.
    compileOnly "net.java.dev.jna:jna:5.14.0"
    compileOnly "net.java.dev.jna:jna-platform:5.14.0"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "optifabric_id", modId
    inputs.property "optifabric_name", modName
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                // The id is the whole point of this branch: third-party metadata that names `optifabric`
                // (c2me's `breaks: optifabric` on this release, plus sodium / iris / EMF / ETF / ImmediatelyFast
                // / Embeddium / Architectury / EBE) stops matching as soon as the jar does not carry that id.
                // `provides` is deliberately absent - Loader builds a `breaks` constraint from a map that
                // includes ids supplied via `provides`, so declaring `provides: ["optifabric"]` would re-arm the
                // very refusal this build exists to avoid (measured on Loader 0.19.5).
                "optifabric_id": modId,
                "optifabric_name": modName
    }

    // Bundle the official -> intermediary mappings taken from the intermediary artifact
    from({ zipTree(configurations.intermediaryMappings.singleFile) }) {
        include "mappings/mappings.tiny"
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named("build") {
    doFirst {
        println "Building ${project.archives_base_name} ${project.version} (Minecraft" +
                " ${project.minecraft_version}, Fabric Loader ${project.loader_version})"
    }
}
