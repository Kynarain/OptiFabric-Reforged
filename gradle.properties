# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.20.6
yarn_mappings=1.20.6+build.3
# Compiled against (and therefore requires) Loader 0.19.3: 0.19.3 and 0.19.5 ship a byte-identical
# net.fabricmc.loader.impl.lib.tinyremapper / mappingio API, so the built jar runs on either.
loader_version=0.19.3
# Mod Properties
# This branch (`wip/1.20.6-reforged`) builds the *alternative* 1.20.6 product: the same sources as the published
# line, published under its own mod id (`optifabric_reforged`). Every third-party metadata declaration that names
# `optifabric` therefore stops matching it - deliberately including c2me's `breaks: optifabric`, which is what
# refuses this mod on 1.20.6. The published line stays on `main` with `id: optifabric` and is unchanged, so a
# user installs exactly one of the two jars. What that costs is in docs/REFORGED_BUILD.md.
mod_version=1.1.4-reforged+mc1.20.6
maven_group=kynarain.cn
# The artifact name carries the product too, so a jar in mods/ is recognisable as this one and matches the id
# inside its own fabric.mod.json. (26.x does the same; 1.21.x still ships `OptiFabric-<version>+mc<version>.jar`.)
archives_base_name=OptiFabric-Reforged
# Dependencies
# ASM version to compile against; at runtime the version shipped with Fabric Loader's launch libraries is used.
# Only APIs present since ASM 9.6 are used, so a newer compile-time version is safe.
asm_version=9.10.1
